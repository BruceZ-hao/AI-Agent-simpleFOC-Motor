<text x="30" y="34" font-size="19" font-weight="600" fill="#1a1d21">SimpleFOC 触觉旋钮台架 — 装配侧视图</text>
<text x="30" y="56" font-size="12" fill="#5b6672">X-Z 剖面（沿板长方向）｜ 三块 130×85×4 mm 板 + 4 根 M3 长螺杆 ｜ 尺寸单位 mm</text>
<line x1="575" y1="24" x2="575" y2="656" stroke="#d8dee6" stroke-width="1"/>
