<text x="338.0" y="319.7" font-size="10.5" fill="#7a8794">M3 螺杆 + 螺母 ×4</text>
<rect x="80.00" y="533.00" width="390.00" height="12.00" rx="2" fill="#dfe6ee" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="179.00" y="524.00" width="18.00" height="9.00" rx="1" fill="#c5d2df" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="353.00" y="524.00" width="18.00" height="9.00" rx="1" fill="#c5d2df" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="180.50" y="519.20" width="189.00" height="4.80" rx="1" fill="#80b78f" stroke="#2f3a45" stroke-width="1.2"/>
<text x="275.0" y="524.6" font-size="10" fill="#1f3d2b" text-anchor="middle">ESP32-S3-DevKitC-1 + DengFOC-Mini（角码限位，底面排针悬空）</text>
<text x="80.0" y="565.0" font-size="11" fill="#2f3a45">01 底板 / 电子层</text>
<rect x="80.00" y="431.00" width="390.00" height="12.00" rx="2" fill="#dfe6ee" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="260.00" y="431.00" width="30.00" height="12.00" rx="0" fill="#f7f8fa" stroke="none" stroke-width="0"/>
<text x="80.0" y="437.0" font-size="11" fill="#2f3a45">02 电机顶板（中心 Ø10 让位孔 + 4 条径向长槽）</text>
<rect x="233.00" y="371.00" width="84.00" height="60.00" rx="4" fill="#b9c7d6" stroke="#2f3a45" stroke-width="1.2"/>
<text x="275.0" y="405.0" font-size="10.5" fill="#263445" text-anchor="middle">无刷云台电机</text>
<rect x="269.00" y="365.00" width="12.00" height="6.00" rx="1" fill="#8e9dac" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="263.00" y="359.00" width="24.00" height="6.00" rx="1" fill="#cf5c5c" stroke="#2f3a45" stroke-width="1.2"/>
<text x="293.0" y="365.0" font-size="10" fill="#a03b3b">径向充磁磁铁</text>
<rect x="240.50" y="346.70" width="69.00" height="4.80" rx="1" fill="#80b78f" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="267.50" y="351.50" width="15.00" height="3.00" rx="0.5" fill="#3f6f52" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="80.00" y="334.70" width="390.00" height="12.00" rx="2" fill="#dfe6ee" stroke="#2f3a45" stroke-width="1.2"/>
<rect x="251.00" y="334.70" width="48.00" height="12.00" rx="0" fill="#f7f8fa" stroke="none" stroke-width="0"/>
<text x="80.0" y="327.7" font-size="11" fill="#2f3a45">03 AS5600 托板（中央 Ø16 观察孔，芯片朝下）</text>
<text x="317.0" y="352.1" font-size="10" fill="#1f3d2b">AS5600 模块（芯片面朝下）</text>
<line x1="275.0" y1="359.0" x2="275.0" y2="354.5" stroke="#c05621" stroke-width="1.4"/>
<line x1="271.0" y1="354.5" x2="279.0" y2="354.5" stroke="#c05621" stroke-width="1.2"/>
<line x1="271.0" y1="359.0" x2="279.0" y2="359.0" stroke="#c05621" stroke-width="1.2"/>
<line x1="275.0" y1="356.8" x2="227.0" y2="356.8" stroke="#c05621" stroke-width="1" stroke-dasharray="3 2"/>
<text x="224.0" y="360.8" font-size="11" font-weight="600" fill="#c05621" text-anchor="end">气隙 1.5 mm（螺母微调，目标 0.5~3）</text>
<line x1="59.00" y1="533.00" x2="59.00" y2="443.00" stroke="#c05621" stroke-width="1"/><line x1="54.00" y1="533.00" x2="64.00" y2="533.00" stroke="#c05621" stroke-width="1"/><line x1="54.00" y1="443.00" x2="64.00" y2="443.00" stroke="#c05621" stroke-width="1"/><text x="68.00" y="492.00" font-size="11" fill="#c05621">电子层净空 30</text>
<line x1="59.00" y1="431.00" x2="59.00" y2="346.70" stroke="#c05621" stroke-width="1"/><line x1="54.00" y1="431.00" x2="64.00" y2="431.00" stroke="#c05621" stroke-width="1"/><line x1="54.00" y1="346.70" x2="64.00" y2="346.70" stroke="#c05621" stroke-width="1"/><text x="68.00" y="392.85" font-size="11" fill="#c05621">电机层 28.1</text>
<text x="30" y="571.0" font-size="10.5" fill="#7a8794">z=0 为底板底面；层高由 M3 螺母无级调节，气隙不需要垫片也能对准</text>
<text x="600" y="92" font-size="17" fill="#1a1d21" font-weight="600">装配顺序</text>
<text x="600" y="114" font-size="12" fill="#374151">1  底板平放，4 根 M3 螺杆从下方穿入四角孔，底部拧螺母当支脚。</text>
<text x="600" y="133" font-size="12" fill="#374151">2  把 ESP32-S3 与 DengFOC-Mini 放进角码（板底排针悬空）；</text>
<text x="600" y="151" font-size="12" fill="#374151">   角码处点一点热熔胶防脱。接好三相线、共地、12V 与 USB。</text>
<text x="600" y="173" font-size="12" fill="#374151">3  套上 02 电机顶板，用 8 个螺母夹住，板下留 30mm 净空。</text>
<text x="600" y="192" font-size="12" fill="#374151">4  电机坐到顶板中央，M3 螺丝沿 4 条径向长槽滑动对准底部孔距。</text>
<text x="600" y="210" font-size="12" fill="#374151">   轴端装径向充磁磁铁，磁铁顶面朝上、与芯片平行。</text>
<text x="600" y="232" font-size="12" fill="#374151">5  套上 03 托板：AS5600 芯片面朝下，用 4 颗 M2 螺丝穿过</text>
<text x="600" y="250" font-size="12" fill="#374151">   径向长槽固定，芯片正好从中央观察孔露出。</text>
<text x="600" y="269" font-size="12" fill="#374151">6  上下拧螺母微调托板高度，把芯片到磁铁的气隙调到 1~2mm，</text>
<text x="600" y="287" font-size="12" fill="#374151">   左右微调 AS5600 板让芯片正对磁铁中心，然后锁紧。</text>
<text x="600" y="301" font-size="12" fill="#374151"></text>
<text x="600" y="313" font-size="15" fill="#1a1d21" font-weight="600">五金 BOM</text>
<text x="600" y="333" font-size="12" fill="#374151">M3 长螺杆 ×4（≥78mm）+ 螺母 ×16 + 垫片 ×8</text>
<text x="600" y="351" font-size="12" fill="#374151">M3×8 ×4（电机底座，若电机是 M2 螺纹加垫片）</text>
<text x="600" y="369" font-size="12" fill="#374151">M2×10 ×4 + M2 螺母 ×4（AS5600 板）</text>
<text x="600" y="387" font-size="12" fill="#374151">M3×10 ×4（底板锁桌面 / 洞洞板，可选）</text>
<text x="600" y="399" font-size="12" fill="#374151"></text>
<text x="600" y="411" font-size="14" fill="#1a1d21" font-weight="600">备选：不用螺杆时打印 04/05 立柱（各 4 根）</text>
<text x="600" y="430" font-size="12" fill="#374151">下段 30.0mm / 上段 28.1mm，两端 Ø3 榫插入板孔；</text>
<text x="600" y="448" font-size="12" fill="#374151">少量胶固定，气隙靠薄垫片微调。</text>
<text x="600" y="458" font-size="12" fill="#374151"></text>
<text x="600" y="470" font-size="15" fill="#1a1d21" font-weight="600">关键提醒</text>
<text x="600" y="489" font-size="12" fill="#8a4b12">• 两块板卡都没有安装孔，只能用角码边沿限位，别想着打孔。</text>
<text x="600" y="508" font-size="12" fill="#8a4b12">• 芯片必须正对磁铁中心且平行；同心度差会让闭环角度非线性。</text>
<text x="600" y="527" font-size="12" fill="#8a4b12">• 上电 initFOC() 会正反各转一下，保持 12V、三相接好、轴空转。</text>
<text x="600" y="546" font-size="12" fill="#8a4b12">• 电机线、传感器线、USB 都从 Ø6 走线孔引出并扎好，别缠住转轴。</text>
</svg>